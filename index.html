<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lattices by Gene</title>
<script>
const destination = new URL('https://latticesbygene.com');
destination.pathname = location.pathname;
destination.search = location.search;
destination.hash = location.hash;
try {
  if (location.pathname === '/' || location.pathname === '/index.html') {
    const prefix = 'artifacts';
    const mode = localStorage.getItem(prefix + '-mode') || localStorage.getItem(prefix + '-edition');
    const saved = JSON.parse(localStorage.getItem(prefix + '-showcase-notifications') || 'null');
    const choice = ['legacy', 'pentimento'].includes(mode) ? mode : '';
    const enabled = typeof saved?.enabled === 'boolean' ? saved.enabled ? 'on' : 'off' : '';
    const mute = Number(saved?.mutes?.temperature);
    const until = Number.isSafeInteger(mute) && mute > 0 && mute < 10000000000000 ? String(mute) : '';
    if (choice || enabled || until) destination.hash = '#lattices-move=' + [choice, enabled, until].join(',') + location.hash;
  }
} catch {}
location.replace(destination.href);
</script></head><body><p>This page has moved to <a href="https://latticesbygene.com/">Lattices by Gene</a>.</p></body></html>
