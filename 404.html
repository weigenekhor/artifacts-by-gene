<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yvenne has moved</title>
  <link rel="canonical" href="https://yvennebygene.com/">
  <script>
const target = new URL('https://yvennebygene.com');
target.pathname = location.pathname;
target.search = location.search;
target.hash = location.hash;
try {
  const saved = localStorage.getItem('artifacts-mode') || localStorage.getItem('artifacts-edition');
  const mode = ['legacy', 'pentimento'].includes(saved) ? saved : '';
  const preferences = JSON.parse(localStorage.getItem('artifacts-showcase-notifications') || 'null');
  const notices = preferences ? (preferences.enabled === false ? 'off' : 'on') : '';
  const mute = preferences?.mutes?.temperature;
  const until = Number.isSafeInteger(mute) && mute > Date.now() && mute <= 9999999999999 ? mute : '';
  if ((mode || notices) && ['/', '/index.html', '/gnx/', '/gnx/index.html'].includes(location.pathname)) {
    target.hash = '#yvenne-move=' + [mode, notices, until].join(',') + location.hash;
  }
} catch {
  // Continue to the matching page if this browser blocks local storage.
}
location.replace(target.href);
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=https://yvennebygene.com/"></noscript>
</head>
<body><p><a href="https://yvennebygene.com/">Continue to Yvenne</a></p></body>
</html>
